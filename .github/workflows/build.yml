name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: ./scripts/test.sh
      - name: Build
        run: ./scripts/build.sh
      - name: Package test build
        run: ./scripts/package.sh
      - name: Test installer
        run: bash Tests/InstallerIntegration.sh dist/StepNext-1.2.2-macOS-arm64-adhoc.zip
      - name: Keep test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StepNext-macOS-arm64-adhoc
          path: |
            dist/StepNext-*-adhoc.zip
            dist/StepNext-*-adhoc.zip.sha256
          if-no-files-found: error
